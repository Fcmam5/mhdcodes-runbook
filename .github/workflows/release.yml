# Builds the Windows, Linux and macOS installers with electron-builder. Pushing a tag like
# v1.2.0 also publishes them as a GitHub release; running it by hand only builds them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          # one DMG per Mac architecture, each built on a runner of that architecture
          - os: macos-latest
            platform: mac
          - os: macos-15-intel
            platform: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # installs Node.js, the pnpm from packageManager in package.json, and the
      # dependencies exactly as pnpm-lock.yaml has them
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # before the build, so the version is baked into the app and the file names
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --no-git-checks

      - run: pnpm build
      - run: pnpm exec electron-builder --${{ matrix.platform }}

      # one unzipped artifact per download, named after the file, so a run's page lists
      # them like a release does
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux'
        with:
          path: dist/runbook-*.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux'
        with:
          path: dist/runbook-*.deb
          archive: false
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'win'
        with:
          path: dist/runbook-*-setup.exe
          archive: false
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'mac'
        with:
          path: dist/runbook-*.dmg
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
